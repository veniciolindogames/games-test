<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Turbo Pulo Neon</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080b20;color:#fff;font-family:system-ui,sans-serif;touch-action:none}body{display:flex;flex-direction:column}header{height:58px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;background:#101437;border-bottom:1px solid #ffffff22}b{letter-spacing:3px;color:#7fffee}button{background:#ffffff12;color:#fff;border:1px solid #ffffff33;border-radius:12px;padding:11px 16px;font-weight:800}main{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:14px 18px auto;display:flex;justify-content:space-between;text-shadow:0 2px 6px #000}.hud span{display:block;font-size:22px;font-weight:900}.right{text-align:right}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080b20aa;padding:18px}.card{max-width:460px;padding:28px;text-align:center;background:#11183eeF;border:1px solid #7fffee55;border-radius:24px;box-shadow:0 20px 80px #0008}.tag{font-size:11px;letter-spacing:3px;color:#ff73da;font-weight:900}h1{margin:14px 0;color:#7fffee;font-size:clamp(32px,7vw,54px)}p{color:#c6d1ff;line-height:1.55}.primary{width:100%;background:#ff73da;color:#1a1233;border:0;padding:15px}.hidden{display:none}footer{height:92px;display:flex;justify-content:space-around;align-items:center;background:#101437}footer button{width:42%;height:62px}#jump{background:#7fffee;color:#101437}#dash{background:#ff73da;color:#1a1233}@media(max-width:540px){footer{height:102px}.card{padding:22px}}
</style><body><header><b>TURBO PULO NEON</b><button id="pause">Ⅱ</button></header><main><canvas id="game"></canvas><div class="hud"><div><small>ENERGIA</small><span id="energy">100%</span><small id="status">PULO DUPLO</small></div><div class="right"><small>PONTOS</small><span id="score">0</span><small id="record">RECORDE 0</small></div></div><div class="overlay" id="overlay"><div class="card"><div class="tag">NOVA ROTA · NOVO DESAFIO</div><h1>TURBO PULO NEON</h1><p>Salte pelos portais, colete energia e use o turbo para atravessar a cidade neon. Cada partida monta uma rota diferente.</p><p>↑ Pular · ⚡ Turbo · P pausa</p><button class="primary" id="start">INICIAR ROTA →</button></div></div></main><footer><button id="dash">⚡ TURBO</button><button id="jump">↑ PULAR</button></footer><script>'use strict';const cv=document.getElementById('game'),c=cv.getContext('2d'),$=id=>document.getElementById(id);let W=900,H=540,s=1,state='menu',last=0,t=0,dist=0,spd=260,energy=100,score=0,best=0,route=0,obs=[],orbs=[],parts=[],dash=0;try{best=+localStorage.getItem('turbo-neon-best')||0}catch(e){}const p={x:150,y:420,w:32,h:42,vy:0,ground:true,air:2,shield:0};function resize(){let r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;W=Math.max(440,540*r.width/r.height);s=cv.height/H}addEventListener('resize',resize);resize();function add(o){(o.type==='orb'?orbs:obs).push(o)}function burst(x,y,col){for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*180,life:.6,col})}function build(){obs=[];orbs=[];route=Math.floor(Math.random()*99);let x=W+180;for(let i=0;i<18;i++){let type=(i*5+route)%4;if(type===0)add({type:'gate',x,y:360-(i%3)*55,w:34,h:88});if(type===1)add({type:'mine',x,y:418,w:32,h:32});if(type===2)add({type:'wall',x,y:300-(i%2)*65,w:30,h:148});if(type===3)add({type:'mine',x,y:418,w:32,h:32});if(i%2===0)add({type:'orb',x:x+80,y:260-(i%4)*28,w:18,h:18});x+=300+(i%3)*70}}function start(){state='play';t=0;dist=0;spd=260;energy=100;score=0;dash=0;Object.assign(p,{x:150,y:420,vy:0,ground:true,air:2,shield:0});$('overlay').classList.add('hidden');build();last=performance.now()}function jump(){if(state!=='play')return;if(p.ground){p.vy=-650;p.ground=false;p.air=2}else if(p.air){p.vy=-460;p.air--}burst(p.x,p.y,'#7fffee')}function turbo(){if(state!=='play'||energy<25)return;energy-=25;dash=.8;spd=520;burst(p.x,p.y,'#ff73da')}function hit(o){if(p.shield>0){p.shield=0;o.dead=true;burst(p.x,p.y,'#fff27a');return}energy=Math.max(0,energy-34);score=Math.max(0,score-25);dash=0;spd=260;burst(p.x,p.y,'#ff527d');if(energy<=0)end()}function end(){state='over';best=Math.max(best,score);try{localStorage.setItem('turbo-neon-best',best)}catch(e){}$('overlay').classList.remove('hidden');$('start').textContent='NOVA ROTA →';$('status').textContent='ROTA ENCERRADA'}function pause(){if(state==='play'){state='pause';$('overlay').classList.remove('hidden');$('start').textContent='CONTINUAR →'}else if(state==='pause'){state='play';$('overlay').classList.add('hidden');last=performance.now()}}function update(dt){t+=dt;spd=Math.min(430,spd+dt*3);if(dash>0){dash-=dt;if(dash<=0)spd=300}let dx=spd*dt;dist+=dx;energy=Math.min(100,energy+dt*3);p.vy+=1500*dt;p.y+=p.vy*dt;p.ground=false;if(p.y>=420){p.y=420;p.vy=0;p.ground=true;p.air=2}for(let o of obs)o.x-=dx;for(let o of orbs)o.x-=dx;for(let o of obs){if(o.dead)continue;let h=p.x+p.w>o.x&&p.x<o.x+o.w&&p.y>o.y&&p.y-p.h<o.y+o.h;if(h){o.dead=true;hit(o)}}for(let o of orbs){if(o.dead)continue;let h=p.x+p.w>o.x&&p.x<o.x+o.w&&p.y>o.y&&p.y-p.h<o.y+o.h;if(h){o.dead=true;energy=Math.min(100,energy+18);score+=10;burst(o.x,o.y,'#7fffee')}}obs=obs.filter(o=>!o.dead&&o.x>-80);orbs=orbs.filter(o=>!o.dead&&o.x>-80);if(obs.length<8)build();score+=Math.floor(dt*spd/12);$('energy').textContent=Math.floor(energy)+'%';$('score').textContent=score;$('record').textContent='RECORDE '+best;$('status').textContent=dash>0?'TURBO ATIVO':'PULO DUPLO'}function draw(){c.setTransform(s,0,0,s,0,0);let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#15104a');g.addColorStop(1,'#07152c');c.fillStyle=g;c.fillRect(0,0,W,H);c.globalAlpha=.25;for(let i=-1;i<W/90+2;i++){c.fillStyle=i%2?'#7fffee':'#ff73da';c.fillRect(i*90-(dist*.2%90),230+(i%4)*35,2,190)}c.globalAlpha=1;c.fillStyle='#141b3e';c.fillRect(0,420,W,120);c.fillStyle='#253a6e';c.fillRect(0,420,W,7);for(let o of obs){c.fillStyle=o.type==='mine'?'#ff527d':o.type==='gate'?'#ff73da':'#7fffee';if(o.type==='mine'){c.beginPath();c.arc(o.x+16,o.y+16,16,0,7);c.fill();c.fillStyle='#fff';c.fillRect(o.x+13,o.y+3,6,26)}else{c.fillRect(o.x,o.y,o.w,o.h);c.fillStyle='#11183e';c.fillRect(o.x+8,o.y+8,o.w-16,o.h-16)}}for(let o of orbs){c.fillStyle='#7fffee';c.beginPath();c.arc(o.x+9,o.y+9,9+Math.sin(t*8+o.x)*2,0,7);c.fill()}let col=p.shield?'#fff27a':'#ffdb80';c.fillStyle=col;c.fillRect(p.x,p.y-p.h,p.w,p.h);c.fillStyle='#ff73da';c.fillRect(p.x+8,p.y-30,20,8);for(let a of parts){a.x+=a.vx/60;a.y+=a.vy/60;a.vy+=8;a.life-=.02;c.globalAlpha=Math.max(0,a.life);c.fillStyle=a.col;c.fillRect(a.x,a.y,5,5)}c.globalAlpha=1}function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(state==='play')update(dt);draw();requestAnimationFrame(frame)}$('start').onclick=()=>state==='pause'?pause():start();$('pause').onclick=pause;$('jump').onpointerdown=jump;$('dash').onpointerdown=turbo;addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code))jump();if(e.code==='ShiftLeft'||e.code==='KeyX')turbo();if(e.code==='KeyP'||e.code==='Escape')pause()});$('record').textContent='RECORDE '+best;requestAnimationFrame(frame)</script></body></html>
